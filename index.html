<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>こうきくんプレゼンツ ビンゴ大会！</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <!-- トップ画面 -->
    <section id="top-view" class="view top" hidden>
      <h1 class="title">
        <span class="title-sub">こうきくんプレゼンツ</span>
        <span class="title-main">ビンゴ大会！</span>
      </h1>

      <form id="range-form" class="panel" novalidate>
        <p class="panel-label">ルーレットに出す数字の範囲</p>
        <div class="range-inputs">
          <label class="field">
            <span class="field-label">最小</span>
            <input id="min-input" type="text" inputmode="numeric" maxlength="2" autocomplete="off">
          </label>
          <span class="range-sep" aria-hidden="true">〜</span>
          <label class="field">
            <span class="field-label">最大</span>
            <input id="max-input" type="text" inputmode="numeric" maxlength="2" autocomplete="off">
          </label>
        </div>
        <p class="hint">1〜99 の数字を入力してください</p>
        <p id="range-error" class="error" role="alert"></p>

        <div class="top-actions">
          <button type="submit" class="btn btn-primary">新しく始める</button>
          <button type="button" id="resume-btn" class="btn btn-secondary" hidden>続きから再開</button>
        </div>
        <p id="resume-info" class="resume-info" hidden></p>
      </form>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-view" class="view game" hidden>
      <header class="game-header">
        <button type="button" id="back-btn" class="btn-small">← トップへ</button>
        <p class="game-title">こうきくんプレゼンツ ビンゴ大会！</p>
        <button type="button" id="sound-btn" class="btn-small" aria-pressed="true"></button>
      </header>

      <div class="game-body">
        <div class="roulette-area">
          <div id="roulette" class="roulette">
            <span id="roulette-number" class="roulette-number">?</span>
          </div>
          <p id="remaining" class="remaining"></p>
          <button type="button" id="spin-btn" class="btn btn-spin">スタート</button>
        </div>

        <div class="history-area">
          <h2 class="history-title">出た番号 <span id="drawn-count" class="drawn-count"></span></h2>
          <ol id="history" class="history"></ol>
          <p id="history-empty" class="history-empty">まだ番号は出ていません</p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
